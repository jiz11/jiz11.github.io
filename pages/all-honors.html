<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Honors & Awards | Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,400;0,600;0,700&family=Inter:wght@300;400;500;600;700&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="bg-[#f6f8fa] text-[#24292e] antialiased font-sans">
    
    <nav class="academic-topbar sticky top-0 z-30 mb-8 px-4 h-14 flex items-center justify-between">
        <div class="max-w-4xl mx-auto w-full flex items-center justify-between">
            <a href="../index.html" class="font-medium text-sm text-blue-600 hover:underline flex items-center gap-1.5">
                <i class="fas fa-arrow-left text-xs"></i> Back to Homepage
            </a>
            <span class="text-xs font-mono text-slate-500 uppercase">Honors Archive</span>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 pb-16">
        <div class="academic-card">
            <div class="academic-card-header">
                <h1 class="academic-card-title">
                    <i class="fas fa-award"></i> All Honors &amp; Awards
                </h1>
            </div>
            <div class="academic-card-body">
                <div id="all-honors-container" class="space-y-1">
                    <!-- Loaded dynamically -->
                </div>
            </div>
        </div>
    </main>

    <script>
        fetch('../data/honors.json')
            .then(res => res.json())
            .then(items => {
                const container = document.getElementById('all-honors-container');
                container.innerHTML = items.map(item => `
                    <div class="honor-item-row">
                        <div>
                            <span class="font-medium text-slate-800">${item.title}</span>
                            ${item.org ? `<span class="text-xs text-slate-500 block sm:inline sm:ml-2">(${item.org})</span>` : ''}
                        </div>
                        <span class="font-mono text-xs font-semibold text-blue-600 ml-4 whitespace-nowrap bg-blue-50 px-2 py-0.5 rounded border border-blue-100">${item.date}</span>
                    </div>
                `).join('');
            });
    </script>
</body>
</html>
