<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Publications | Archive</title>
    
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
    <style>
        body {
            padding: 4vh 6vw;
            max-width: 1200px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 25px; border-bottom: 1px solid rgba(255, 255, 255, 0.08);">
        <a href="../index.html" style="color: var(--accent-color); font-family: 'Questrial', sans-serif; text-decoration: none; font-size: 16px; font-weight: bold; display: flex; align-items: center; gap: 8px;">
            <i class="fas fa-arrow-left"></i> Back to Portfolio
        </a>
        <span style="font-family: 'Questrial', sans-serif; color: var(--text-secondary); font-size: 14px;">Publications Archive</span>
    </div>

    <div style="margin-top: 40px;">
        <h1 style="font-size: 48px; font-family: 'Questrial', sans-serif; color: #fff; margin-bottom: 30px;">All Publications.</h1>
        <div class="projects" id="all-publications-container"></div>
    </div>

    <div id="footer" style="margin-top: 60px;">
        <p>made on earth by a human &nbsp;·&nbsp; <a href="../index.html">Back to Home</a></p>
    </div>

    <script>
        function getTagIcon(text) {
            const lower = String(text || '').toLowerCase();
            if (lower.includes('pdf') || lower.includes('paper')) return 'far fa-file-pdf';
            if (lower.includes('code') || lower.includes('github')) return 'fab fa-github';
            if (lower.includes('doi') || lower.includes('link')) return 'fas fa-external-link-alt';
            return 'fas fa-link';
        }

        fetch('../data/publications.json')
            .then(res => res.json())
            .then(publications => {
                const container = document.getElementById('all-publications-container');
                container.innerHTML = publications.map(pub => {
                    const tagsHtml = pub.tags && pub.tags.length ? pub.tags.map(tag => `
                        <a href="${tag.link}" target="_blank" rel="noopener noreferrer" class="gitfolio-tag-btn">
                            <i class="${getTagIcon(tag.text)}"></i> ${tag.text}
                        </a>
                    `).join('') : '';

                    const thumbHtml = pub.thumbnail ? `
                        <div class="pub-gitfolio-teaser">
                            <img src="${pub.thumbnail}" alt="${pub.title} preview" loading="lazy">
                        </div>
                    ` : '';

                    return `
                        <section class="gitfolio-card">
                            <div>
                                ${thumbHtml}
                                <div class="section_title">${pub.displayTitle || pub.title}</div>
                                <div class="about_section">
                                    <p style="margin: 0 0 6px 0;">${pub.authors}</p>
                                    <p style="margin: 0; color: #8b949e; font-size: 14px;">
                                        <em>${pub.venue}</em>
                                        ${pub.venueTag ? ` <span class="venue-tag-badge">${pub.venueTag}</span>` : ''}
                                    </p>
                                </div>
                            </div>
                            <div class="bottom_section">
                                <span><i class="fas fa-calendar"></i> ${pub.year}</span>
                                ${tagsHtml}
                            </div>
                        </section>
                    `;
                }).join('');
            });
    </script>
</body>
</html>
