<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Publications | Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,400;0,600;0,700&family=Inter:wght@300;400;500;600;700&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="bg-[#f6f8fa] text-[#24292e] antialiased font-sans">
    
    <nav class="academic-topbar sticky top-0 z-30 mb-8 px-4 h-14 flex items-center justify-between">
        <div class="max-w-4xl mx-auto w-full flex items-center justify-between">
            <a href="../index.html" class="font-medium text-sm text-blue-600 hover:underline flex items-center gap-1.5">
                <i class="fas fa-arrow-left text-xs"></i> Back to Homepage
            </a>
            <span class="text-xs font-mono text-slate-500 uppercase">Publications Archive</span>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 pb-16">
        <div class="academic-card">
            <div class="academic-card-header">
                <h1 class="academic-card-title">
                    <i class="fas fa-book-open"></i> All Publications &amp; Working Papers
                </h1>
            </div>
            <div class="academic-card-body">
                <div id="all-publications-container" class="space-y-4">
                    <!-- Loaded dynamically -->
                </div>
            </div>
        </div>
    </main>

    <script>
        function getTagIcon(text) {
            const lower = String(text || '').toLowerCase();
            if (lower.includes('pdf') || lower.includes('paper')) return 'far fa-file-pdf';
            if (lower.includes('code') || lower.includes('github')) return 'fab fa-github';
            if (lower.includes('doi') || lower.includes('link')) return 'fas fa-external-link-alt';
            return 'fas fa-link';
        }

        fetch('../data/publications.json')
            .then(res => res.json())
            .then(pubs => {
                const container = document.getElementById('all-publications-container');
                container.innerHTML = pubs.map(pub => {
                    const tagsHtml = pub.tags && pub.tags.length ? `
                        <div class="flex flex-wrap gap-2 pt-1">
                            ${pub.tags.map(tag => `
                                <a href="${tag.link}" target="_blank" rel="noopener noreferrer" class="pub-action-btn">
                                    <i class="${getTagIcon(tag.text)}"></i> ${tag.text}
                                </a>
                            `).join('')}
                        </div>
                    ` : '';

                    const thumbHtml = pub.thumbnail ? `
                        <div class="pub-teaser-box">
                            <img src="${pub.thumbnail}" alt="${pub.title} preview" loading="lazy">
                        </div>
                    ` : '';

                    return `
                        <div class="pub-card-item">
                            ${thumbHtml}
                            <div class="flex-1 space-y-1.5 min-w-0">
                                <h3 class="pub-title text-base">${pub.title}</h3>
                                <p class="pub-authors">${pub.authors}</p>
                                <div class="pub-venue">
                                    <span>${pub.venue}</span>
                                    ${pub.venueTag ? `<span class="pub-venue-badge">${pub.venueTag}</span>` : ''}
                                </div>
                                ${tagsHtml}
                            </div>
                        </div>
                    `;
                }).join('');
            });
    </script>
</body>
</html>
